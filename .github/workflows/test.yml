name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run tests
        working-directory: backend
        run: chmod +x mvnw && ./mvnw test -B

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  qa-analysis:
    name: QA Analysis
    needs: [backend-tests, frontend-build]
    if: always()
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Start app
        run: |
          docker compose down 2>/dev/null || true
          docker compose up -d --build --wait
        timeout-minutes: 5

      - name: Wait for app
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:8080/api/health | grep -q healthy && exit 0
            sleep 2
          done

      - name: Run QA Agent
        run: |
          docker run --rm --network host \
            -e ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY}" \
            -e GITHUB_TOKEN="${GH_PAT}" \
            -e GITHUB_EVENT_NAME="${GITHUB_EVENT_NAME}" \
            -e GITHUB_EVENT_PATH="/event.json" \
            -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            -v "${GITHUB_EVENT_PATH}:/event.json:ro" \
            -v "$(pwd):/workspace:ro" \
            magnum-opus:latest pr .magnum-opus/config.yml
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Stop app
        if: always()
        run: docker compose down 2>/dev/null || true
