name: Test

on:
  pull_request:
    branches: [main]

jobs:
  qa-pending:
    name: QA Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Set QA pending
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -d '{"state":"pending","context":"QA / PR Analysis","description":"Waiting for tests to complete...","target_url":"https://github.com/${{ github.repository }}/actions"}'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run tests
        working-directory: backend
        run: chmod +x mvnw && ./mvnw test -B

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
