name: QA

on:
  # Run after the Test workflow completes on PRs
  workflow_run:
    workflows: ["Test"]
    types: [completed]
  # Also run on @qa comments
  issue_comment:
    types: [created]

jobs:
  pr-analysis:
    name: PR Analysis
    runs-on: self-hosted
    if: >
      github.event_name == 'workflow_run' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@qa'))
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.head_ref }}

      - name: Start app
        run: |
          docker compose down 2>/dev/null || true
          docker compose up -d --build --wait
        timeout-minutes: 5

      - name: Wait for app
        run: |
          echo "Waiting for app health check..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/api/health | grep -q healthy; then
              echo "App is ready!"
              exit 0
            fi
            sleep 2
          done
          echo "App didn't start in time, proceeding anyway..."

      - name: Run QA Agent
        run: |
          docker run --rm --network host \
            -e ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY}" \
            -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
            -e GITHUB_EVENT_NAME="${GITHUB_EVENT_NAME}" \
            -e GITHUB_EVENT_PATH="/event.json" \
            -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            -v "${GITHUB_EVENT_PATH}:/event.json:ro" \
            -v "$(pwd):/workspace:ro" \
            magnum-opus:latest pr .magnum-opus/config.yml
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop app
        if: always()
        run: docker compose down 2>/dev/null || true
