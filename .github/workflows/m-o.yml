name: QA

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["CI", "Tests", "maven"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Operating mode'
        required: true
        default: 'onboard'
        type: choice
        options:
          - onboard
          - monitor
          - pr

jobs:
  pr-qa:
    name: PR Analysis
    runs-on: self-hosted
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@qa'))
    steps:
      - uses: actions/checkout@v4

      - name: Start app
        run: docker-compose up -d

      - name: Wait for app
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:8080/api/health > /dev/null 2>&1 && break
            sleep 2
          done

      - name: Run QA Agent (PR Mode)
        run: |
          docker run --rm --network host \
            -e ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY}" \
            -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
            -e GITHUB_EVENT_NAME="${GITHUB_EVENT_NAME}" \
            -e GITHUB_EVENT_PATH="/event.json" \
            -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            -v "${GITHUB_EVENT_PATH}:/event.json:ro" \
            -v "$(pwd):/workspace:ro" \
            magnum-opus:latest pr .magnum-opus/config.yml
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  monitor:
    name: Pipeline Monitor
    runs-on: self-hosted
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.mode == 'monitor')
    steps:
      - uses: actions/checkout@v4

      - name: Run QA Agent (Monitor Mode)
        run: |
          docker run --rm --network host \
            -e ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY}" \
            -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
            -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            -e GITHUB_REF_NAME="${GITHUB_REF_NAME}" \
            -e GITHUB_RUN_ID="${GITHUB_RUN_ID}" \
            -v "$(pwd):/workspace:ro" \
            magnum-opus:latest monitor .magnum-opus/config.yml
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  onboard:
    name: Onboarding
    runs-on: self-hosted
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.mode == 'onboard'
    steps:
      - uses: actions/checkout@v4

      - name: Start app
        run: docker-compose up -d

      - name: Wait for app
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:8080/api/health > /dev/null 2>&1 && break
            sleep 2
          done

      - name: Run QA Agent (Onboarding Mode)
        run: |
          docker run --rm --network host \
            -e ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY}" \
            -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
            -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            -v "$(pwd):/workspace" \
            magnum-opus:latest onboard .magnum-opus/config.yml
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
