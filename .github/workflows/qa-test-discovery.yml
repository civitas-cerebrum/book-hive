name: QA Agent — Test Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC

jobs:
  discovery:
    name: QA Agent — Test Discovery
    runs-on: self-hosted
    timeout-minutes: 120

    steps:
      - name: QA Agent — Test Discovery
        run: |
          echo ""
          echo "  ███╗   ███╗ █████╗  ██████╗ ███╗   ██╗██╗   ██╗███╗   ███╗"
          echo "  ████╗ ████║██╔══██╗██╔════╝ ████╗  ██║██║   ██║████╗ ████║"
          echo "  ██╔████╔██║███████║██║  ███╗██╔██╗ ██║██║   ██║██╔████╔██║"
          echo "  ██║╚██╔╝██║██╔══██║██║   ██║██║╚██╗██║██║   ██║██║╚██╔╝██║"
          echo "  ██║ ╚═╝ ██║██║  ██║╚██████╔╝██║ ╚████║╚██████╔╝██║ ╚═╝ ██║"
          echo "  ╚═╝     ╚═╝╚═╝  ╚═╝ ╚═════╝ ╚═╝  ╚═══╝ ╚═════╝ ╚═╝     ╚═╝"
          echo "                          ██████╗ ██████╗ ██╗   ██╗███████╗"
          echo "                         ██╔═══██╗██╔══██╗██║   ██║██╔════╝"
          echo "                         ██║   ██║██████╔╝██║   ██║███████╗"
          echo "                         ██║   ██║██╔═══╝ ██║   ██║╚════██║"
          echo "                         ╚██████╔╝██║     ╚██████╔╝███████║"
          echo "                          ╚═════╝ ╚═╝      ╚═════╝ ╚══════╝"
          echo ""
          echo "  Agentic Quality Assurance Pipeline"
          echo "  Mode: Test Discovery"
          echo "  Repo: ${{ github.repository }}"
          echo ""

          # Trigger the QA Agent
          RESPONSE=$(curl -s -X POST http://localhost:3001/trigger \
            -H "Content-Type: application/json" \
            -d "{
              \"repo\": \"${{ github.repository }}\",
              \"mode\": \"discover\"
            }")

          RUN_ID=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('runId',''))" 2>/dev/null)

          if [ -z "$RUN_ID" ]; then
            echo "Failed to trigger QA Agent: $RESPONSE"
            exit 1
          fi

          echo "[QA Agent] Run started: $RUN_ID"
          echo ""

          # Poll for progress
          LAST_COUNT=0
          while true; do
            STATUS=$(curl -s http://localhost:3001/runs/$RUN_ID 2>/dev/null)
            RUN_STATUS=$(echo "$STATUS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',''))" 2>/dev/null)

            # Print new progress lines
            PROGRESS=$(echo "$STATUS" | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          for line in d.get('progress', []):
              print('[QA Agent]', line)
          " 2>/dev/null)
            CURRENT_COUNT=$(echo "$PROGRESS" | wc -l | tr -d ' ')

            if [ "$CURRENT_COUNT" -gt "$LAST_COUNT" ]; then
              echo "$PROGRESS" | tail -n +$((LAST_COUNT + 1))
              LAST_COUNT=$CURRENT_COUNT
            fi

            # Check if done
            if [ "$RUN_STATUS" = "completed" ] || [ "$RUN_STATUS" = "failed" ]; then
              echo ""
              echo "[QA Agent] Run $RUN_STATUS"
              if [ "$RUN_STATUS" = "failed" ]; then
                ERROR=$(echo "$STATUS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('error','Unknown error'))" 2>/dev/null)
                echo "[QA Agent] Error: $ERROR"
                exit 1
              fi
              break
            fi

            sleep 30
          done
