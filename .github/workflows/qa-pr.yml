name: QA

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
  issue_comment:
    types: [created]

jobs:
  pr-analysis:
    name: PR Analysis
    runs-on: self-hosted
    if: >
      github.event_name == 'workflow_run' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@qa'))
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set check status (pending)
        if: github.event_name == 'workflow_run'
        run: |
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          curl -s -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$HEAD_SHA" \
            -d '{"state":"pending","context":"QA / PR Analysis","description":"Magnum Opus is analyzing...","target_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Start app
        run: |
          docker compose down 2>/dev/null || true
          docker compose up -d --build --wait
        timeout-minutes: 5

      - name: Wait for app
        run: |
          echo "Waiting for app health check..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/api/health | grep -q healthy; then
              echo "App is ready!"
              exit 0
            fi
            sleep 2
          done
          echo "App didn't start in time, proceeding anyway..."

      - name: Run QA Agent
        id: qa
        run: |
          docker run --rm --network host \
            -e ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY}" \
            -e GITHUB_TOKEN="${GH_PAT}" \
            -e GITHUB_EVENT_NAME="${GITHUB_EVENT_NAME}" \
            -e GITHUB_EVENT_PATH="/event.json" \
            -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            -v "${GITHUB_EVENT_PATH}:/event.json:ro" \
            -v "$(pwd):/workspace:ro" \
            magnum-opus:latest pr .magnum-opus/config.yml
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Set check status (success)
        if: github.event_name == 'workflow_run' && success()
        run: |
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          curl -s -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$HEAD_SHA" \
            -d '{"state":"success","context":"QA / PR Analysis","description":"Magnum Opus analysis complete","target_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Set check status (failure)
        if: github.event_name == 'workflow_run' && failure()
        run: |
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          curl -s -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$HEAD_SHA" \
            -d '{"state":"failure","context":"QA / PR Analysis","description":"Magnum Opus analysis failed","target_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Stop app
        if: always()
        run: docker compose down 2>/dev/null || true
