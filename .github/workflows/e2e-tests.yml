name: E2E Tests

on:
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Start application
        run: docker compose up -d --wait
        timeout-minutes: 5

      - name: Wait for backend health check
        run: |
          echo "Waiting for backend to be healthy..."
          for i in $(seq 1 60); do
            if curl -s http://localhost:8080/api/health | grep -q '"status":"healthy"'; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Attempt $i: Backend not ready yet..."
            sleep 2
          done
          echo "Backend failed to become healthy"
          docker compose logs backend
          exit 1

      - name: Wait for frontend
        run: |
          echo "Waiting for frontend to be ready..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:7547 | grep -q "BookHive"; then
              echo "Frontend is ready!"
              exit 0
            fi
            echo "Attempt $i: Frontend not ready yet..."
            sleep 2
          done
          echo "Frontend failed to become ready"
          docker compose logs frontend
          exit 1

      - name: Install E2E test dependencies
        run: cd tests/e2e && npm ci

      - name: Install Playwright browsers
        run: cd tests/e2e && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd tests/e2e && npx playwright test
        env:
          CI: true

      - name: Upload test report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

      - name: Upload test results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: tests/e2e/test-results/
          retention-days: 7

      - name: Stop application
        if: always()
        run: docker compose down
